name: Build OrangeFox X6885

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device/infinix/X6885

      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            git \
            git-lfs \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            libc6-dev-i386 \
            libncurses5 \
            libncurses5-dev \
            x11proto-core-dev \
            libx11-dev \
            libreadline-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            fontconfig \
            python3 \
            rsync \
            ccache

      - name: Install repo
        run: |
          mkdir -p $HOME/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo \
            > $HOME/bin/repo
          chmod a+x $HOME/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Initialize OrangeFox
        run: |
          mkdir -p $GITHUB_WORKSPACE/fox_12.1
          cd $GITHUB_WORKSPACE/fox_12.1

          git clone https://gitlab.com/OrangeFox/sync.git orangefox_sync

          cd orangefox_sync

          ./orangefox_sync.sh \
            --branch 12.1 \
            --path $GITHUB_WORKSPACE/fox_12.1

      - name: Copy X6885 device tree
        run: |
          cd $GITHUB_WORKSPACE/fox_12.1

          rm -rf device/infinix/X6885

          cp -a \
            $GITHUB_WORKSPACE/device/infinix/X6885 \
            device/infinix/X6885

      - name: Configure OrangeFox
        run: |
          cd $GITHUB_WORKSPACE/fox_12.1

          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export FOX_VANILLA_BUILD=1
          export FOX_BUILD_BASH=1
          export FOX_MAINTAINER_PATCH_VERSION=1

          echo "FOX_AB_DEVICE=1"
          echo "FOX_VIRTUAL_AB_DEVICE=1"
          echo "FOX_VANILLA_BUILD=1"

          source build/envsetup.sh

          export FOX_BUILD_DEVICE=X6885

          lunch twrp_X6885-userdebug

      - name: Build OrangeFox
        run: |
          cd $GITHUB_WORKSPACE/fox_12.1

          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export FOX_VANILLA_BUILD=1
          export FOX_BUILD_BASH=1
          export FOX_MAINTAINER_PATCH_VERSION=1

          source build/envsetup.sh

          export FOX_BUILD_DEVICE=X6885

          lunch twrp_X6885-userdebug

          mka recoveryimage -j2 | tee build.log

      - name: Find build output
        if: always()
        run: |
          cd $GITHUB_WORKSPACE/fox_12.1

          echo "===== OUTPUT ====="

          find out/target/product/X6885 \
            -maxdepth 1 \
            -type f \
            -printf "%f\n" 2>/dev/null || true

          echo "===== ORANGEFOX IMAGES ====="

          find out/target/product/X6885 \
            -iname "*OrangeFox*" \
            -o -iname "*recovery*.img" \
            2>/dev/null || true

      - name: Upload OrangeFox image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-X6885
          path: |
            fox_12.1/out/target/product/X6885/OrangeFox-unofficial-X6885.img
            fox_12.1/out/target/product/X6885/recovery.img
            fox_12.1/build.log
          if-no-files-found: warn
